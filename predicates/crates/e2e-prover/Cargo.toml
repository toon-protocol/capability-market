[package]
name = "e2e-prover"
version = "0.1.0"
edition = "2021"
description = "Host prover for devnet e2e: proves the matmul guest (dev-mode fake or real Groth16) and emits (journal, seal) hex for cast"
license = "MIT"

[dependencies]
matmul = { path = "../matmul" }
journal = { path = "../journal" }
risc0-zkvm = "3.0"
risc0-ethereum-contracts = "3.0"
anyhow = "1"
hex = "0.4"
