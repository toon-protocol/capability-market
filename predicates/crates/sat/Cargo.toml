[package]
name = "sat"
version = "0.1.0"
edition = "2021"
description = "Small 3-SAT floor predicate for the TOON capability market (toon-meta#122)"
license = "MIT"

[dependencies]
# Deliberately dependency-light: the shared journal envelope crate and the
# canonical input-manifest crate (both guest-parseable, sha2-only). RISC Zero
# guest deps arrive with the toolchain wiring; see README.
journal = { path = "../journal" }
manifest = { path = "../manifest" }
