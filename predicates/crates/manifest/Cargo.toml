[package]
name = "manifest"
version = "0.1.0"
edition = "2021"
description = "Canonical capability-market input manifest: deterministic guest-parseable encoding, marketParamsHash = sha256(manifest bytes) (toon-meta#121)"
license = "MIT"

[dependencies]
# The manifest is consumed INSIDE the zkVM guest, so its only dependency is the
# same sha2 the journal crate already pulls in. No serde, no allocof heavy
# parsers — the encoding is a hand-rolled length-prefixed TLV so the guest
# parse is a handful of slice reads.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
